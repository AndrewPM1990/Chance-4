<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Cauldron Rests</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a2e, #050510);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: 'Cinzel', serif;
}

.container {
  color: #c0c0ff;
  text-shadow: 0 0 8px #c0c0ff, 0 0 20px #6a5acd;
}

.line {
  opacity: 0;
  font-size: 2.4rem;
  margin: 20px 0;
  animation: fadeIn 2s forwards;
}

.line:nth-child(1) { animation-delay: 0s; }
.line:nth-child(2) { animation-delay: 2s; }
.line:nth-child(3) { animation-delay: 4s; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div class="container">
  <div class="line">🌙 The Great Magic Cauldron is quiet at this time</div>
  <div class="line">✨ Your Magic is yet to be revealed!</div>
  <div class="line">💫 Sorry — you are not a winner.</div>
</div>
</body>
</html>
